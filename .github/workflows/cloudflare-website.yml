name: Cloudflare website and feedback
on:
  workflow_dispatch:
    inputs:
      target:
        description: Reviewed deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-website-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.target == 'staging' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: cloudflare-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run build:feedback
      - run: bun test tests/extension-stats.test.mjs tests/worker.test.mjs
      - run: python3 -B tests/site_http_test.py
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy reviewed assets and existing feedback service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENVIRONMENT: ${{ inputs.target }}
        run: bunx wrangler deploy --config feedback/worker/wrangler.jsonc --env "$DEPLOY_ENVIRONMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: website-snapshot-${{ github.run_id }}
          path: build/website-snapshot
