name: Official website
on:
  workflow_dispatch:
    inputs:
      publish_website:
        description: 'Deploy the reviewed website from develop (does not submit stores)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-site.ts
      - run: python3 -B tests/site_http_test.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_website == true &&
      github.ref == 'refs/heads/develop')
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
