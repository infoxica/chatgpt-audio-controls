name: Legacy website redirects
on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/build-site.ts', 'scripts/prepare-web-assets.ts', 'scripts/preview-site.py', 'tests/site_http_test.py', 'src/shared/i18n/**', 'src/shared/constants.ts', 'config/release.json', 'assets/**', 'public/icons/**', '.github/workflows/pages.yml', 'package.json', 'bun.lock']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      publish_website:
        description: 'Deploy the reviewed website from develop or master (does not submit stores)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-site.ts
      - run: python3 -B tests/site_http_test.py
      - run: bun run prepare:web-assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/legacy-pages
  deploy:
    if: >-
      vars.WEBSITE_CLOUDFLARE_READY == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_website == true &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')))
    # Enable only after the new Cloudflare hostname passes production checks.
    # Keep the previous Pages site online until then.
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
