name: Official website
on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/build-site.ts', 'src/shared/i18n/**', 'src/shared/constants.ts', 'config/release.json', 'assets/store/screenshots/**', '.github/workflows/pages.yml', 'package.json', 'bun.lock']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-site.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
