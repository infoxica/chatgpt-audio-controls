name: CI & Release

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Generate icons
        run: bun run build:icons

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun run release:check
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build extension and userscript
        run: bun run build

      - name: Package extension ZIP
        run: bun run scripts/package-zip.ts

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist-zip/*.zip
            userscript/chatgpt-audio-controls.user.js

  release:
    name: Publish GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/dist-zip/*.zip
            release-assets/userscript/chatgpt-audio-controls.user.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
