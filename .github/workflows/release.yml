name: CI & Release

on:
  push:
    branches:
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      publish_to_stores:
        description: "Publish this version to the Chrome Web Store and Microsoft Edge Add-ons?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      store:
        description: "Store to retry"
        type: choice
        default: both
        options: [both, chrome, edge]

permissions:
  contents: read

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package extension
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      version: ${{ steps.policy.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Release policy
        id: policy
        run: bun scripts/release-policy.mjs
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish_to_stores }}

      - name: Generate icons
        run: bun run build:icons

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/v') || steps.policy.outputs.publish == 'true'
        run: bun run release:check
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.policy.outputs.version) }}

      - name: Build extension and userscript
        run: bun run build

      - name: Build website and feedback fixtures
        run: |
          bun run scripts/build-site.ts
          bun run scripts/build-feedback.ts

      - name: Install test browser
        run: bunx playwright install --with-deps chromium

      - name: Browser integration checks
        run: bunx playwright test

      - name: Package extension ZIP
        run: bun run scripts/package-zip.ts

      - name: Validate archive
        run: python3 scripts/validate-package.py dist-zip/*.zip

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist-zip/*.zip
            userscript/chatgpt-audio-controls.user.js

  release:
    name: Publish GitHub release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.verify.outputs.publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.verify.outputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/dist-zip/*.zip
            release-assets/userscript/chatgpt-audio-controls.user.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    name: Publish chrome store update
    needs: verify
    if: needs.verify.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.store == 'both' || inputs.store == 'chrome')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          path: release-assets
      - name: Submit to chrome
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: bash scripts/publish-chrome.sh

  publish-edge:
    name: Publish edge store update
    needs: verify
    if: needs.verify.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.store == 'both' || inputs.store == 'edge')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension-release-${{ github.run_id }}
          path: release-assets
      - name: Submit to edge
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: bash scripts/publish-edge.sh
