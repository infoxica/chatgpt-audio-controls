<!doctype html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#172c2a;font:17px/1.5 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:32px 20px 64px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:13px}select{max-width:150px;padding:8px;border:1px solid #bbc8c3;border-radius:8px;background:white}h1{font-size:clamp(28px,6vw,42px);line-height:1.15;margin:42px 0 16px;letter-spacing:-.035em}p{margin:12px 0}.muted{color:#506460;font-size:14px}fieldset{border:0;padding:0;margin:24px 0}legend{margin-bottom:12px}.reason{display:flex;align-items:center;gap:12px;background:white;border:1px solid #bccac3;border-radius:12px;padding:14px 16px;margin:8px 0;cursor:pointer}.reason:has(input:checked){border-color:#14765b;background:#e9f6ef;box-shadow:0 0 0 1px #14765b}input[type=radio]{accent-color:#14765b;width:18px;height:18px;flex-shrink:0}button{font:inherit;border-radius:10px;padding:12px 20px;cursor:pointer;border:1px solid #bccac3;background:white}button[type=submit]{background:#145c49;color:white;border-color:#145c49}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #df9a32;outline-offset:3px}textarea{display:block;width:100%;min-height:110px;resize:vertical;border:1px solid #bbc8c3;border-radius:8px;padding:12px;font:inherit}summary{cursor:pointer;padding:12px 0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}#error{color:#a12e28}#done{padding:40px 0}.trap{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}[hidden]{display:none!important}
</style></head><body><main>
<header><strong>ChatGPT Audio Controls</strong><label><span id="languageLabel">Language</span> <select id="language"></select></label></header>
<section id="survey"><h1 data-copy="surveyTitle"></h1><p data-copy="surveyIntro"></p>
<form id="form"><fieldset id="reasons"><legend data-copy="surveyHint"></legend></fieldset>
<details><summary data-copy="addNote"></summary><label class="muted" for="note" data-copy="noteHint"></label><textarea id="note" maxlength="1000" aria-describedby="privacy"></textarea></details>
<label class="trap" aria-hidden="true">Website<input id="website" tabindex="-1" autocomplete="off"></label>
<p id="error" role="alert"></p><div class="actions"><button id="send" type="submit" data-copy="send"></button><button type="button" id="skip" data-copy="skip"></button></div>
<p id="privacy" class="muted" data-copy="feedbackPrivacy"></p></form></section>
<section id="done" hidden tabindex="-1" aria-live="polite"><h1 id="confirmation"></h1></section>
</main><script>
const state = <?!= bootstrap ?>;
const codes = ['broken','intrusive','slow','difficult','missing','language','unneeded','other'];
const keys = ['reasonBroken','reasonIntrusive','reasonSlow','reasonDifficult','reasonMissing','reasonLanguage','reasonUnneeded','reasonOther'];
const $ = id => document.getElementById(id);
let saving = false, finished = '', errorKey = '';
const copy = () => state.locales[state.locale] || state.locales.en;
for (const [value, name] of Object.entries(state.names)) { const option = new Option(name, value); $('language').add(option); }
$('language').value = state.locale;
codes.forEach((code, index) => { const label = document.createElement('label'); label.className='reason'; const input=document.createElement('input');input.type='radio';input.name='reason';input.value=code;const text=document.createElement('span');text.dataset.copy=keys[index];label.append(input,text);$('reasons').append(label); });
function translate() { document.documentElement.lang=state.locale; document.querySelectorAll('[data-copy]').forEach(el => el.textContent=copy()[el.dataset.copy]); $('languageLabel').textContent=copy().language; $('error').textContent=errorKey ? copy()[errorKey] : ''; if(finished) $('confirmation').textContent=copy()[finished]; }
function done(key) { finished=key; $('survey').hidden=true; $('done').hidden=false; translate(); $('done').focus(); }
$('language').addEventListener('change', () => {state.locale=$('language').value;translate();});
$('skip').addEventListener('click', () => {if(!saving) done('goodbye');});
function busy(value) { saving=value; $('send').disabled=value; $('skip').disabled=value; $('language').disabled=value; $('reasons').disabled=value; $('note').disabled=value; $('send').textContent=copy()[value?'sending':'send']; }
$('form').addEventListener('submit', event => {
  event.preventDefault(); if(saving || finished) return;
  const selected = document.querySelector('input[name=reason]:checked');
  if(!selected) { errorKey='chooseReason';translate();document.querySelector('input[name=reason]').focus();return; }
  errorKey='';translate();busy(true);
  const input = {id:state.id,expires:state.expires,token:state.token,locale:state.locale,version:state.version,browser:state.browser,os:state.os,reason:selected.value,comment:$('note').value,website:$('website').value};
  const failed=()=>{busy(false);errorKey='feedbackError';translate();};
  try { google.script.run.withSuccessHandler(result=>{if(result && result.saved===true) {busy(false);done('thanks');} else failed();}).withFailureHandler(failed).submitFeedback(input); } catch (_) {failed();}
});
translate();
</script></body></html>
